services:
  postgres:
    profiles:
      - disabled
  redis:
    ports: !override
      - "6381:6379"
  backend:
    ports:
      - "8200:8000"
    environment:
      BASE_URL: http://localhost:8200
      APP_URL: http://localhost:3200
      CORS_ORIGINS: http://localhost:3200
      DATABASE_URL: sqlite:///./data/tickets.db
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@dispotree.com}
    volumes:
      - aitickets_data:/app/data
    depends_on: !override
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
  mcp-server:
    profiles:
      - disabled
  event-consumer:
    profiles:
      - disabled
  frontend:
    ports: !override
      - "3200:3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: https://tickets.emprezario.com
        NEXT_PUBLIC_SITE_URL: https://tickets.emprezario.com
    depends_on:
      backend:
        condition: service_healthy

volumes:
  aitickets_data:

<!-- Social Proof & FOMO Widget -->
<div id="social-proof-container" class="space-y-3">
    <!-- Live Viewers -->
    <div id="live-viewers" class="hidden animate-fade-in bg-gradient-to-r from-red-500/10 to-orange-500/10 border border-red-500/30 rounded-lg px-4 py-2.5">
        <div class="flex items-center gap-2 text-sm">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
            </span>
            <span class="text-red-200 font-medium">
                <span id="viewer-count">0</span> people viewing right now
            </span>
        </div>
    </div>

    <!-- Recent Purchases (Ticker) -->
    <div id="recent-purchases" class="hidden space-y-2"></div>

    <!-- Sales Velocity -->
    <div id="sales-velocity" class="hidden animate-fade-in bg-gradient-to-r from-green-500/10 to-emerald-500/10 border border-green-500/30 rounded-lg px-4 py-2.5">
        <div class="flex items-center gap-2 text-sm">
            <span class="text-xl">⚡</span>
            <span id="velocity-message" class="text-green-200 font-medium"></span>
        </div>
    </div>

    <!-- Scarcity Indicators -->
    <div id="scarcity-indicators" class="space-y-2"></div>

    <!-- Countdowns -->
    <div id="countdowns" class="space-y-2"></div>
</div>

<style>
.social-proof-pulse {
    animation: social-proof-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

@keyframes social-proof-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.slide-in-right {
    animation: slide-in-right 0.5s ease-out;
}

@keyframes slide-in-right {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

.slide-out-right {
    animation: slide-out-right 0.3s ease-in forwards;
}

@keyframes slide-out-right {
    from {
        transform: translateX(0);
        opacity: 1;
    }
    to {
        transform: translateX(100%);
        opacity: 0;
    }
}
</style>

<script>
(function() {
    const eventId = {{ event.id }};
    const API_BASE = '/api/social-proof';

    let purchaseQueue = [];
    let currentPurchaseTimeout = null;

    // Fetch and update social proof data
    async function updateSocialProof() {
        try {
            const response = await fetch(`${API_BASE}/events/${eventId}`);
            if (!response.ok) return;

            const data = await response.json();

            // Update live viewers
            if (data.live_viewers > 1) {
                document.getElementById('viewer-count').textContent = data.live_viewers;
                document.getElementById('live-viewers').classList.remove('hidden');
            }

            // Update sales velocity
            if (data.velocity && data.velocity.message) {
                document.getElementById('velocity-message').textContent = data.velocity.message;
                document.getElementById('sales-velocity').classList.remove('hidden');
            }

            // Update recent purchases
            if (data.recent_purchases && data.recent_purchases.length > 0) {
                purchaseQueue = data.recent_purchases;
                if (!currentPurchaseTimeout) {
                    showNextPurchase();
                }
            }

            // Update scarcity indicators
            updateScarcityIndicators(data.scarcity);

            // Update countdowns
            updateCountdowns(data.countdowns);

        } catch (error) {
            console.error('Failed to fetch social proof:', error);
        }
    }

    // Show purchase notifications one at a time
    function showNextPurchase() {
        if (purchaseQueue.length === 0) {
            currentPurchaseTimeout = null;
            return;
        }

        const purchase = purchaseQueue.shift();
        const container = document.getElementById('recent-purchases');

        // Create purchase notification
        const notification = document.createElement('div');
        notification.className = 'slide-in-right bg-gradient-to-r from-blue-500/10 to-indigo-500/10 border border-blue-500/30 rounded-lg px-4 py-2.5';
        notification.innerHTML = `
            <div class="flex items-center gap-3 text-sm">
                <div class="flex-shrink-0 w-8 h-8 bg-blue-500/20 rounded-full flex items-center justify-center">
                    <span class="text-blue-300 font-semibold">${purchase.name[0]}</span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-blue-200 font-medium truncate">
                        <span class="font-semibold">${purchase.name}</span> from ${purchase.location}
                    </div>
                    <div class="text-blue-300/70 text-xs">
                        bought ${purchase.quantity} ticket${purchase.quantity > 1 ? 's' : ''} ${purchase.time_ago}
                    </div>
                </div>
                <span class="text-xl">🎟️</span>
            </div>
        `;

        container.appendChild(notification);
        container.classList.remove('hidden');

        // Remove after 5 seconds
        setTimeout(() => {
            notification.classList.add('slide-out-right');
            setTimeout(() => {
                notification.remove();
                if (container.children.length === 0) {
                    container.classList.add('hidden');
                }
            }, 300);
        }, 5000);

        // Show next purchase after 6 seconds
        currentPurchaseTimeout = setTimeout(showNextPurchase, 6000);
    }

    // Update scarcity indicators
    function updateScarcityIndicators(scarcity) {
        if (!scarcity || !scarcity.messages || scarcity.messages.length === 0) return;

        const container = document.getElementById('scarcity-indicators');
        container.innerHTML = '';

        scarcity.messages.forEach(msg => {
            const colorMap = {
                critical: 'red',
                warning: 'yellow',
                urgent: 'orange',
                price: 'purple'
            };
            const color = colorMap[msg.type] || 'gray';

            const indicator = document.createElement('div');
            indicator.className = `animate-fade-in bg-gradient-to-r from-${color}-500/10 to-${color}-600/10 border border-${color}-500/30 rounded-lg px-4 py-2.5`;
            indicator.innerHTML = `
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-xl social-proof-pulse">${msg.icon}</span>
                    <span class="text-${color}-200 font-medium">${msg.text}</span>
                </div>
            `;
            container.appendChild(indicator);
        });
    }

    // Update countdowns
    function updateCountdowns(countdowns) {
        if (!countdowns || countdowns.length === 0) return;

        const container = document.getElementById('countdowns');
        container.innerHTML = '';

        countdowns.forEach(timer => {
            const countdown = document.createElement('div');
            countdown.className = 'animate-fade-in bg-gradient-to-r from-purple-500/10 to-pink-500/10 border border-purple-500/30 rounded-lg px-4 py-2.5';
            countdown.innerHTML = `
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-xl">${timer.icon}</span>
                    <span class="text-purple-200 font-medium">
                        ${timer.text}
                    </span>
                </div>
            `;
            container.appendChild(countdown);
        });
    }

    // Initial load
    updateSocialProof();

    // Refresh every 30 seconds
    setInterval(updateSocialProof, 30000);

    // Refresh live viewers more frequently (every 10 seconds)
    setInterval(async () => {
        try {
            const response = await fetch(`${API_BASE}/events/${eventId}/live-viewers`);
            if (!response.ok) return;
            const data = await response.json();

            if (data.live_viewers > 1) {
                document.getElementById('viewer-count').textContent = data.live_viewers;
                document.getElementById('live-viewers').classList.remove('hidden');
            }
        } catch (error) {
            // Silent fail
        }
    }, 10000);
})();
</script>
